[package]
name = "forward-timer-config"
version = "1.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
wit-bindgen = { version = "0.57.1", features = ["async", "async-spawn"] }
